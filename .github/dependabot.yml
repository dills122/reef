version: 2

multi-ecosystem-groups:
  matching-engine:
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Toronto"

  simulator:
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "06:00"
      timezone: "America/Toronto"

  jvm-services:
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "06:00"
      timezone: "America/Toronto"

  javascript-apps:
    schedule:
      interval: "weekly"
      day: "thursday"
      time: "06:00"
      timezone: "America/Toronto"

  infrastructure:
    schedule:
      interval: "weekly"
      day: "friday"
      time: "06:00"
      timezone: "America/Toronto"

updates:
  - package-ecosystem: "gomod"
    directory: "/services/matching-engine"
    patterns:
      - "*"
    multi-ecosystem-group: "matching-engine"

  - package-ecosystem: "docker"
    directory: "/services/matching-engine"
    patterns:
      - "*"
    ignore:
      # The Go toolchain is bumped manually in one coordinated change:
      # services/*/go.mod (x2), .github/workflows/ci.yml (govulncheck go-version),
      # and services/*/Dockerfile (x2). Enforced by scripts/ci/check-dependency-alignment.mjs.
      - dependency-name: "golang"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
    multi-ecosystem-group: "matching-engine"

  - package-ecosystem: "gomod"
    directory: "/services/simulator"
    patterns:
      - "*"
    multi-ecosystem-group: "simulator"

  - package-ecosystem: "docker"
    directory: "/services/simulator"
    patterns:
      - "*"
    ignore:
      # The Go toolchain is bumped manually in one coordinated change:
      # services/*/go.mod (x2), .github/workflows/ci.yml (govulncheck go-version),
      # and services/*/Dockerfile (x2). Enforced by scripts/ci/check-dependency-alignment.mjs.
      - dependency-name: "golang"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
    multi-ecosystem-group: "simulator"

  - package-ecosystem: "gradle"
    directories:
      - "/services/arena-control-plane"
      - "/services/platform-runtime"
      - "/services/stock-data"
    patterns:
      - "*"
    multi-ecosystem-group: "jvm-services"

  - package-ecosystem: "docker"
    directories:
      - "/services/arena-control-plane"
      - "/services/platform-runtime"
      - "/services/stock-data"
    patterns:
      - "*"
    multi-ecosystem-group: "jvm-services"

  - package-ecosystem: "bun"
    directories:
      - "/"
      - "/apps/arena-admin"
      - "/packages/bot-sdk"
    patterns:
      - "*"
    ignore:
      # svelte-check 4.7.3 crashes during startup with TypeScript 7.
      - dependency-name: "typescript"
        versions:
          - ">=7"
    multi-ecosystem-group: "javascript-apps"

  # The docs deployment uses npm and package-lock.json in CI.
  - package-ecosystem: "npm"
    directory: "/apps/docs-site"
    patterns:
      - "*"
    ignore:
      # @astrojs/check 0.9.x only supports TypeScript 5 and 6.
      - dependency-name: "typescript"
        versions:
          - ">=7"
    multi-ecosystem-group: "javascript-apps"

  - package-ecosystem: "docker"
    directory: "/infra/hetzner-core/server/deploy-receiver"
    patterns:
      - "*"
    multi-ecosystem-group: "javascript-apps"

  - package-ecosystem: "docker-compose"
    directories:
      - "/"
      - "/infra/hetzner-core/server"
    patterns:
      - "*"
    ignore:
      # PostgreSQL majors require an explicit pg_upgrade and volume migration.
      - dependency-name: "postgres"
        update-types:
          - "version-update:semver-major"
      # Dependabot treats architecture-variant tags (e.g. 0.162.0-386) as
      # newer versions; the real release tag is the plain X.Y.Z.
      - dependency-name: "otel/opentelemetry-collector-contrib"
        versions:
          - "*-386"
          - "*-amd64"
          - "*-arm64"
          - "*-armv7"
          - "*-ppc64le"
          - "*-s390x"
          - "*-riscv64"
          - "*-windows*"
    multi-ecosystem-group: "infrastructure"

  - package-ecosystem: "opentofu"
    directories:
      - "/infra/do-benchmark"
      - "/infra/hetzner-core/tofu"
    patterns:
      - "*"
    multi-ecosystem-group: "infrastructure"

  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/setup-toolchain"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "18:00"
      timezone: "America/Toronto"
    groups:
      repository-automation:
        patterns:
          - "*"
