name: Records retention
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: records-retention-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  retention:
    name: Records retention
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          bun: 'true'
      - run: bun run repo:check:records
      - run: bun run repo:test:records
